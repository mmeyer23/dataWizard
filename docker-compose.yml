services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: data_wizard_demo
      POSTGRES_USER: data_wizard_runner
      POSTGRES_PASSWORD: data_wizard_local_only
    ports:
      - "5432:5432"
    volumes:
      - data-wizard-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U data_wizard_runner -d data_wizard_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  data-wizard-postgres:
